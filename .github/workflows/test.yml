name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2025-vs2026

    runs-on: ${{ matrix.runs-on }}

    defaults:
      run:
        shell: wsl-bash {0}

    steps:
      - name: Setup WSL
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-26.04
          wsl-shell-command: bash -c "cd && bash --noprofile --norc -euo pipefail '{0}'"

      - name: Checkout repository
        run: |
          mkdir workspace
          cd workspace
          git clone "https://github.com/${{ github.repository }}.git" .
          git fetch origin "${{ github.ref }}"
          git checkout FETCH_HEAD

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison dwarves libssl-dev libelf-dev cpio qemu-utils rsync bc

      - name: Setup minix filesystem
        run: |
          ./workspace/setup.sh

      - name: Test
        run: |
          sudo ./workspace/test.sh
