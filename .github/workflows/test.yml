name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-2025-vs2026
            use-nix: false
          - runs-on: windows-2025-vs2026
            use-nix: true

    runs-on: ${{ matrix.runs-on }}

    defaults:
      run:
        shell: wsl-bash {0}

    steps:
      - name: Setup WSL
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-26.04
          wsl-shell-command: bash -c "cd && bash --noprofile --norc -euo pipefail '{0}'"

      - name: Checkout repository
        run: |
          mkdir workspace
          cd workspace
          git clone "https://github.com/${{ github.repository }}.git" .
          git fetch origin "${{ github.ref }}"
          git checkout FETCH_HEAD

      - name: Install dependencies
        if: ${{ !matrix.use-nix }}
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison dwarves libssl-dev libelf-dev cpio qemu-utils rsync bc util-linux-extra

      - name: Setup minix filesystem
        if: ${{ !matrix.use-nix }}
        run: ./workspace/setup.sh

      - name: Test
        if: ${{ !matrix.use-nix }}
        run: ./workspace/test.sh

      - name: Setup Nix
        if: ${{ matrix.use-nix }}
        run: curl --proto '=https' --tlsv1.2 -L https://nixos.org/nix/install | sh -s -- --daemon

      - name: Setup minix filesystem (Nix)
        if: ${{ matrix.use-nix }}
        run: sudo /nix/var/nix/profiles/default/bin/nix run --extra-experimental-features "nix-command flakes" --ignore-env -k HOME ./workspace#setup -- --no-sudo

      - name: Test (Nix)
        if: ${{ matrix.use-nix }}
        run: sudo /nix/var/nix/profiles/default/bin/nix run --extra-experimental-features "nix-command flakes" --ignore-env ./workspace#test -- --no-sudo
